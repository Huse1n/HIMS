name: HIMS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/customer-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/customer-service/pom.xml

      - name: Run Backend Tests
        env:
          HIMS_ADMIN_PASSWORD: ${{ secrets.HIMS_ADMIN_PASSWORD }}
          HIMS_USER_PASSWORD: ${{ secrets.HIMS_USER_PASSWORD }}
        run: ./mvnw clean verify

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/hims-web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/hims-web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test -- --watch=false

      - name: Build Angular
        run: npm run build
