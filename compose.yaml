services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hims_customer_db
      POSTGRES_USER: hims
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U hims -d hims_customer_db" ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./backend/customer-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hims_customer_db
      SPRING_DATASOURCE_USERNAME: hims
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      HIMS_ADMIN_PASSWORD: ${HIMS_ADMIN_PASSWORD}
      HIMS_USER_PASSWORD: ${HIMS_USER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend/hims-web
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
